# Entorno Docker para LS ASESORES
# Levanta la aplicación web (PHP + Apache) con base de datos ficticia (Mock DB).
# También conserva los servicios auxiliares de MariaDB y Adminer.
#
#   docker compose up -d --build
#
#   Landing : http://localhost:8080
#   Adminer : http://localhost:8081 (opcional)
#   MariaDB : localhost:3307 (opcional)

services:
  web:
    build:
      context: .
    container_name: lsasesores_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: development
      DB_DRIVER: mock
    restart: unless-stopped

  db:
    image: mariadb:10.11
    container_name: lsasesores_db
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: lsasesores
      MARIADB_USER: lsasesores
      MARIADB_PASSWORD: lsasesores
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: lsasesores_adminer
    depends_on:
      - db
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    restart: unless-stopped

volumes:
  db_data:
